name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write   # necessario per ottenere il token OIDC da scambiare con AWS

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ['backend', 'frontend']
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Normalizza owner in minuscolo
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - stampa i claim del token OIDC
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configura credenziali AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build immagine ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/habit-tracker-${{ matrix.service }}:${{ github.ref_name }} \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/habit-tracker-${{ matrix.service }}:$(git rev-parse --short HEAD) \
            -t ${{ steps.login-ecr.outputs.registry }}/habit-tracker-${{ matrix.service }}:${{ github.ref_name }} \
            -t ${{ steps.login-ecr.outputs.registry }}/habit-tracker-${{ matrix.service }}:$(git rev-parse --short HEAD) \
            -f ${{ matrix.service }}/Dockerfile .

      - name: Push immagine ${{ matrix.service }} su GHCR
        run: docker push --all-tags ghcr.io/${{ env.IMAGE_OWNER }}/habit-tracker-${{ matrix.service }}

      - name: Push immagine ${{ matrix.service }} su ECR
        run: docker push --all-tags ${{ steps.login-ecr.outputs.registry }}/habit-tracker-${{ matrix.service }}