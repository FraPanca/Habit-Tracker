name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ['backend', 'frontend']
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Normalizza owner in minuscolo
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immagine ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/habit-tracker-${{ matrix.service }}:${{ github.ref_name }} \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/habit-tracker-${{ matrix.service }}:$(git rev-parse --short HEAD) \
            -f ${{ matrix.service }}/Dockerfile .

      - name: Push immagine ${{ matrix.service }}
        run: docker push --all-tags ghcr.io/${{ env.IMAGE_OWNER }}/habit-tracker-${{ matrix.service }}