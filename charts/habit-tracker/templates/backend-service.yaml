apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "habit-tracker.labels" . | nindent 4 }}
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: {{ .Values.config.port | int }}
      targetPort: {{ .Values.config.port | int }}