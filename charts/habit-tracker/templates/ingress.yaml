{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "habit-tracker.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "habit-tracker.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "habit-tracker.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}