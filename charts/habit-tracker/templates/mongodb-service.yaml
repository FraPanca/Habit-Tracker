apiVersion: v1
kind: Service
metadata:
  name: {{ include "habit-tracker.mongodbServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "habit-tracker.labels" . | nindent 4 }}
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017