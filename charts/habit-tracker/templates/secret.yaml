{{/*
Il Secret viene creato dal chart SOLO se non è in uso Secret esterno. Se invece è valorizzato existingSecret questo file non produce nulla.
*/}}
{{- if not .Values.mongodb.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "habit-tracker.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "habit-tracker.labels" . | nindent 4 }}
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: {{ required "mongodb.auth.username obbligatorio se non usi existingSecret (vedi values-secret.yaml.example)" .Values.mongodb.auth.username | b64enc }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "mongodb.auth.password obbligatorio se non usi existingSecret (vedi values-secret.yaml.example)" .Values.mongodb.auth.password | b64enc }}
{{- end }}