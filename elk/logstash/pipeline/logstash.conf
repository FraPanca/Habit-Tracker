input {
  beats {
    port => 5044
  }
}

filter {

  # ---------- BACKEND: log JSON scritti da Winston ----------
  if [fields][service] == "backend" {
    json {
      source => "message"
    }
    date {
      match => ["timestamp", "ISO8601"]
      remove_field => ["timestamp"]
    }
    mutate {
      rename => {
        "level"  => "[log][level]"
        "method" => "[http][request][method]"
        "path"   => "[url][path]"
        "status" => "[http][response][status_code]"
      }
    }
  }

  # ---------- FRONTEND: access log nginx ----------
  if [fields][service] == "frontend" {
    # scarta le richieste dell'healthcheck del container (rumore)
    if [message] =~ /"Wget"\s*$/ {
      drop { }
    }

    grok {
      match => {
        "message" => '%{IPORHOST:[source][address]} - %{DATA:[@metadata][remote_user]} \[%{HTTPDATE:[@metadata][nginx_time]}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"'
      }
    }
    date {
      match  => ["[@metadata][nginx_time]", "dd/MMM/yyyy:HH:mm:ss Z"]
      locale => "en"
    }
  }

  # ---------- pulizia dei metadati di Filebeat che non servono ----------
  mutate {
    remove_field => ["[agent]", "[ecs]", "[input]", "[host]", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "habit-tracker-%{[fields][service]}-%{+YYYY.MM.dd}"
  }
}