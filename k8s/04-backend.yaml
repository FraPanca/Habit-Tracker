apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: habit-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: habit-tracker-backend:latest 
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: habit-tracker-config
          env:
          - name: MONGO_USER
            valueFrom:
              secretKeyRef:
                name: habit-tracker-db-secret
                key: MONGO_INITDB_ROOT_USERNAME
          - name: MONGO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: habit-tracker-db-secret
                key: MONGO_INITDB_ROOT_PASSWORD
          - name: MONGO_URI
            value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017/$(MONGO_DB_NAME)?authSource=admin"
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 300m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: habit-tracker
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000