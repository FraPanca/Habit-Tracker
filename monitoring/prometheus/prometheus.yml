global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: habit-tracker
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus monitora se stesso (salute del TSDB, durata delle valutazioni, ...)
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Metriche applicative esposte da prom-client (RED + runtime Node.js + business)
  - job_name: habit-tracker-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

  # Metriche dei container (CPU, memoria, rete) raccolte da cAdvisor
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Scarta le serie dei cgroup di sistema senza nome di container:
      # riduce la cardinalità e tiene solo i container dello stack.
      - source_labels: [name]
        regex: ''
        action: drop

  # Metriche del database (connessioni, operazioni, memoria)
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']